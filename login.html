<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login — Campus Voice</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-slate-800 font-sans antialiased">

  <!-- Background decorative glow -->
  <div class="fixed top-10 left-10 w-72 h-72 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-10 right-10 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card Container -->
  <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 p-6 sm:p-8 relative z-10 transition-all">
    
    <!-- Top Brand Logo -->
    <div class="text-center mb-5 flex flex-col items-center">
      <img src="assets/logo-transparent.png" alt="Campus Voice Logo" class="h-20 w-auto object-contain mb-1">
      <p class="text-xs font-semibold text-indigo-600 tracking-wide mb-0.5">One campus, one voice</p>
      <p class="text-[11px] text-slate-500">Government Engineering College, Hassan</p>
    </div>

    <!-- ROLE SELECTION TABS: Student vs Lecturer -->
    <div class="mb-5">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 text-center">
        Select Your Role to Continue
      </label>
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl border border-slate-200">
        <button type="button" id="roleStudentBtn" 
                class="py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-sm">
          <span>🎓</span>
          <span>Student</span>
        </button>
        <button type="button" id="roleLecturerBtn" 
                class="py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-transparent text-slate-600 hover:text-slate-900">
          <span>👨‍🏫</span>
          <span>Lecturer / Faculty</span>
        </button>
      </div>
    </div>

    <!-- Alert / Status message box -->
    <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border"></div>

    <!-- =========================================================================
         FORM 1: STUDENT LOGIN (Name + USN + Email)
         ========================================================================= -->
    <form id="studentLoginForm" class="flex flex-col gap-3.5">
      
      <!-- Student Name -->
      <div>
        <label for="studentName" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          Student Full Name <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input type="text" id="studentName" required placeholder="e.g. Shreya Sharma"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
      </div>

      <!-- Student USN -->
      <div>
        <label for="studentUsn" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          University Seat Number (USN) <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
            </svg>
          </span>
          <input type="text" id="studentUsn" required placeholder="e.g. 4GH22CS085"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
        <p class="text-[11px] text-slate-400 mt-1">Branch is auto-detected from USN (e.g. CS &rarr; CSE)</p>
      </div>

      <!-- Student Email -->
      <div>
        <label for="studentEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          Student Email Address <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </span>
          <input type="email" id="studentEmail" required placeholder="e.g. shreya.cs22@gechassan.ac.in"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
      </div>

      <!-- Submit as Student -->
      <button type="submit" 
              class="w-full mt-2 py-3 px-4 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 shadow-md shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 group">
        <span>Login as Student</span>
        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <!-- Quick Demo Student Helper -->
      <div class="text-center pt-2">
        <button type="button" id="fillStudentDemoBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold underline">
          Auto-fill Demo Student (Shreya - 4GH22CS085)
        </button>
      </div>

    </form>

    <!-- =========================================================================
         FORM 2: LECTURER LOGIN (Name + Email + Phone Number)
         ========================================================================= -->
    <form id="lecturerLoginForm" class="flex flex-col gap-3.5 hidden">
      
      <!-- Lecturer Name -->
      <div>
        <label for="lecturerName" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          Lecturer / Faculty Full Name <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input type="text" id="lecturerName" placeholder="e.g. Dr. Suresh Kumar"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
      </div>

      <!-- Lecturer Email -->
      <div>
        <label for="lecturerEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          Faculty Email Address <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </span>
          <input type="email" id="lecturerEmail" placeholder="e.g. suresh.faculty@gechassan.ac.in"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
      </div>

      <!-- Lecturer Phone Number -->
      <div>
        <label for="lecturerPhone" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          Phone Number <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
          </span>
          <input type="tel" id="lecturerPhone" placeholder="e.g. 9876543210"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
      </div>

      <!-- Lecturer Department -->
      <div>
        <label for="lecturerDept" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
          Department / Branch
        </label>
        <select id="lecturerDept" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="CSE">Computer Science &amp; Engineering (CSE)</option>
          <option value="ISE">Information Science &amp; Engineering (ISE)</option>
          <option value="ECE">Electronics &amp; Communication (ECE)</option>
          <option value="ME">Mechanical Engineering (ME)</option>
          <option value="CV">Civil Engineering (CV)</option>
          <option value="AI&ML">AI &amp; Machine Learning (AI&ML)</option>
          <option value="General">General Administration / Exam Cell</option>
        </select>
      </div>

      <!-- Submit as Lecturer -->
      <button type="submit" 
              class="w-full mt-2 py-3 px-4 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 shadow-md shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 group">
        <span>Login as Lecturer</span>
        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <!-- Quick Demo Lecturer Helper -->
      <div class="text-center pt-2">
        <button type="button" id="fillLecturerDemoBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold underline">
          Auto-fill Demo Lecturer (Prof. Suresh - CSE)
        </button>
      </div>

    </form>

  </div>

  <script>
    const USER_STORAGE_KEY = 'campus_voice_logged_in_user';
    let currentRole = 'student'; // 'student' or 'lecturer'

    const roleStudentBtn = document.getElementById('roleStudentBtn');
    const roleLecturerBtn = document.getElementById('roleLecturerBtn');
    const studentForm = document.getElementById('studentLoginForm');
    const lecturerForm = document.getElementById('lecturerLoginForm');
    const alertBox = document.getElementById('loginAlert');

    const fillStudentDemoBtn = document.getElementById('fillStudentDemoBtn');
    const fillLecturerDemoBtn = document.getElementById('fillLecturerDemoBtn');

    // Switch between Student and Lecturer tabs
    function setRole(role) {
      currentRole = role;
      alertBox.classList.add('hidden');

      if (role === 'student') {
        roleStudentBtn.className = 'py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-sm';
        roleLecturerBtn.className = 'py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-transparent text-slate-600 hover:text-slate-900';
        studentForm.classList.remove('hidden');
        lecturerForm.classList.add('hidden');
      } else {
        roleLecturerBtn.className = 'py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-sm';
        roleStudentBtn.className = 'py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-transparent text-slate-600 hover:text-slate-900';
        lecturerForm.classList.remove('hidden');
        studentForm.classList.add('hidden');
      }
    }

    roleStudentBtn.addEventListener('click', () => setRole('student'));
    roleLecturerBtn.addEventListener('click', () => setRole('lecturer'));

    // Check existing login
    document.addEventListener('DOMContentLoaded', () => {
      const existing = localStorage.getItem(USER_STORAGE_KEY);
      if (existing) {
        try {
          const user = JSON.parse(existing);
          if (user.role === 'lecturer') {
            setRole('lecturer');
            document.getElementById('lecturerName').value = user.name || '';
            document.getElementById('lecturerEmail').value = user.email || '';
            document.getElementById('lecturerPhone').value = user.phone || '';
            document.getElementById('lecturerDept').value = user.department || 'CSE';
          } else {
            setRole('student');
            document.getElementById('studentName').value = user.name || '';
            document.getElementById('studentUsn').value = user.usn || '';
            document.getElementById('studentEmail').value = user.email || '';
          }
        } catch(e) {}
      }
    });

    // Auto-fill Student Demo
    fillStudentDemoBtn.addEventListener('click', () => {
      document.getElementById('studentName').value = 'Shreya Sharma';
      document.getElementById('studentUsn').value = '4GH22CS085';
      document.getElementById('studentEmail').value = 'shreya.cs22@gechassan.ac.in';
    });

    // Auto-fill Lecturer Demo
    fillLecturerDemoBtn.addEventListener('click', () => {
      document.getElementById('lecturerName').value = 'Dr. Suresh Kumar';
      document.getElementById('lecturerEmail').value = 'suresh.kumar@gechassan.ac.in';
      document.getElementById('lecturerPhone').value = '9876543210';
      document.getElementById('lecturerDept').value = 'CSE';
    });

    // Submit Student Form
    studentForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      const usn = document.getElementById('studentUsn').value.trim().toUpperCase();
      const email = document.getElementById('studentEmail').value.trim();

      if (!name || !usn || !email) {
        showAlert('Please fill in Student Name, USN, and Email.', 'error');
        return;
      }
      if (usn.length < 5) {
        showAlert('Please enter a valid College USN (minimum 5 characters).', 'error');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        showAlert('Please enter a valid email address.', 'error');
        return;
      }

      let detectedBranch = 'All';
      if (usn.includes('CS')) detectedBranch = 'CSE';
      else if (usn.includes('IS')) detectedBranch = 'ISE';
      else if (usn.includes('EC')) detectedBranch = 'ECE';
      else if (usn.includes('ME')) detectedBranch = 'ME';
      else if (usn.includes('CV')) detectedBranch = 'CV';
      else if (usn.includes('AI')) detectedBranch = 'AI&ML';

      const userData = {
        role: 'student',
        name,
        usn,
        email,
        detectedBranch,
        loginTime: new Date().toISOString()
      };

      localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(userData));
      showAlert('Student login successful! Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    });

    // Submit Lecturer Form
    lecturerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('lecturerName').value.trim();
      const email = document.getElementById('lecturerEmail').value.trim();
      const phone = document.getElementById('lecturerPhone').value.trim();
      const department = document.getElementById('lecturerDept').value;

      if (!name || !email || !phone) {
        showAlert('Please fill in Lecturer Name, Email, and Phone Number.', 'error');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        showAlert('Please enter a valid faculty email address.', 'error');
        return;
      }
      if (phone.replace(/[^0-9]/g, '').length < 8) {
        showAlert('Please enter a valid phone number (minimum 8-10 digits).', 'error');
        return;
      }

      const userData = {
        role: 'lecturer',
        name,
        email,
        phone,
        department,
        detectedBranch: department,
        loginTime: new Date().toISOString()
      };

      localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(userData));
      showAlert('Lecturer login successful! Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
      if (type === 'error') {
        alertBox.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      } else {
        alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
      }
    }
  </script>
</body>
</html>
